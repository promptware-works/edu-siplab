# Test case (AI input) — schema: siplab/schema/test-case.schema.json
test_id: deregistration-1001
title: User 1001 registers and later de-registers
objective: Evaluate that user 1001 removes its registration cleanly when the account is disabled on the
  client.
focus:
- registration
endpoints:
- user: '1001'
  device: Linphone desktop
  address: 192.168.56.21
  role: registrant
pbx:
  software: Asterisk 20.9.3 (PJSIP)
  address: 192.168.56.10
  notes: 'Default dial plan: Dial(PJSIP/${EXTEN}) followed by Hangup(), so calls to configured but unregistered
    endpoints are answered with 404 Not Found. Endpoints authenticate REGISTER and INVITE with digest
    (MD5). direct_media=no, so media is anchored at the PBX. qualify_frequency=60.'
preconditions:
- Client 1001 is configured correctly
steps:
- Start the capture
- Start client 1001
- After one minute, disable the account on the client
- Stop the capture
expected_observations:
- The REGISTER of 1001 is accepted with 200
- A later REGISTER with Expires 0 removes the binding and is accepted with 200
observed_by_tester:
- Client 1001 showed 'registered', then 'disabled'
capture:
  file: deregistration-1001.pcapng
  transport: udp
  recipe: reference
  synthetic: true
