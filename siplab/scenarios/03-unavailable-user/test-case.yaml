# Test case (AI input) — schema: siplab/schema/test-case.schema.json
test_id: call-to-unregistered-user
title: User 1001 calls user 1003, who is configured but not registered
objective: Evaluate a recorded call attempt from user 1001 to user 1003 while 1003 is offline.
focus:
- registration
- call
endpoints:
- user: '1001'
  device: Linphone desktop
  address: 192.168.56.21
  role: caller
- user: '1003'
  device: Linphone Android
  address: 192.168.56.23
  role: callee
pbx:
  software: Asterisk 20.9.3 (PJSIP)
  address: 192.168.56.10
  notes: Endpoints authenticate REGISTER and INVITE with digest (MD5). Media is anchored at the PBX. Calls
    to configured but unregistered endpoints are answered with 480 Temporarily Unavailable.
preconditions:
- User 1003 is configured on the PBX
- The client of 1003 is switched off
steps:
- Start the capture
- Start client 1001 and wait until it is registered
- Call 1003 from 1001
- Stop the capture after the call attempt ends
expected_observations:
- The INVITE from 1001 is rejected by the PBX with the response configured for unavailable endpoints
observed_by_tester:
- Client 1001 showed 'user unavailable' and the call ended without ringing
capture:
  file: call-to-unregistered-user.pcapng
  transport: udp
  recipe: reference
  synthetic: true
